    <section><h2 id="overview">מי יבנה את מערכות הבינה המלאכותית של מחר?</h2>
      <p>מאחורי כל אפליקציית בינה מלאכותית שנראית פשוטה עומדת מערכת מתוחכמת של אלגוריתמים, נתונים ומודלים חישוביים, ומעל הכול, האנשים שמתכננים, מאמנים, מעריכים ומשפרים אותה.</p>
      <p>השאלה כבר אינה מי יידע להשתמש בכלי בינה מלאכותית, אלא מי יבין איך הם פועלים, היכן גבולותיהם ואיך לפתח אותם באחריות. התוכנית נבנתה לסטודנטים מצטיינים שרוצים לחקור בינה מלאכותית ברמה העמוקה ביותר כבר מהיום הראשון.</p>
    </section>
    <section><h2 id="curriculum">מה לומדים</h2>
      <p>תוכנית הלימודים בנויה סביב בינה מלאכותית, עם 18 קורסים חדשים שפותחו במיוחד ומועברים בידי סגל בעל מוניטין בין־לאומי.</p>
      <ul class="kv">
        <li><b>שנה א׳</b><span>קורסי יסוד בבינה מלאכותית כבר מהסמסטר הראשון, לצד תכנות ברמה נמוכה של חומרת מחשב.</span></li>
        <li><b>שנים ב׳–ג׳</b><span>תכנות GPU ומערכות מתקדמות של למידת מכונה.</span></li>
        <li><b>שנה ג׳</b><span>סוכני בינה מלאכותית ורובוטיקה מבוססת בינה מלאכותית.</span></li>
        <li><b>בחירה מתקדמת</b><span>בניית מודלי שפה גדולים (LLMs) מהיסודות.</span></li>
        <li><b>לאורך התואר</b><span>מתמטיקה ותאוריה המותאמות לבינה מלאכותית, ופרויקטים מעשיים עם מערכות בינה מלאכותית אמיתיות.</span></li>
      </ul>
      <p>הסטודנטים משתלבים גם במעבדות מתקדמות בקריפטוגרפיה ובעיבוד שפה, משתתפים בסדנאות סייבר מעשיות ועובדים ישירות עם מומחים מהתעשייה.</p>
      <blockquote class="pull"><p>״מטרת התוכנית אינה רק להכיר לסטודנטים כלי בינה מלאכותית, אלא לעזור להם להבין כיצד המערכות האלה פועלות ברמה היסודית, וללמד אותם לפתח את המערכות בעצמם.״</p><footer>פרופ׳ גל קמינקא, ראש התוכנית</footer></blockquote>
    </section>

    <section><h2 id="why-now">למה עכשיו</h2>
      <p>בינה מלאכותית נמצאת היום בלב ההייטק, הבריאות, הפיננסים, הסייבר, החינוך והשירותים הציבוריים. במקביל, עבודת ההנדסה בתחילת הדרך השתנתה: תכנות ובדיקות שגרתיים הופכים לאוטומטיים יותר ויותר. בוגרים בעלי הבנה חישובית עמוקה ומומחיות אמיתית בבינה מלאכותית הופכים למבוקשים הרבה יותר.</p>
      <p>תארים ראשונים ייעודיים בבינה מלאכותית עדיין נדירים. בר־אילן מצטרפת למוסדות כמו Carnegie Mellon ו־UC San Diego שהקימו תארים כאלה.</p>
    </section>
    <section><h2 id="responsibility">טכנולוגיה עם אחריות אנושית</h2>
      <p>מפתחי בינה מלאכותית חייבים להתמודד גם עם שאלות של הוגנות, הטיות, פרטיות, אמון והשפעה חברתית. כל סטודנט לומד את קורס החובה <em>חברה, אתיקה וטכנולוגיה בעידן הבינה המלאכותית</em>.</p>
    </section>
    <section><h2 id="faculty">הנהגה וסגל</h2>
      <p>בראש התוכנית עומד <a class="inline" href="#/faculty/gal-kaminka">פרופ׳ גל קמינקא</a>, מייסד המעבדה לרובוטיקה בבר־אילן. הוא הוכשר ב־USC וב־Carnegie Mellon, הוא מהישראלים המעטים שנבחרו לעמיתים הן ב־AAAI והן ב־EurAI, וזכה בפרס לנדאו למצוינות במחקר.</p>
      <ul class="kv">
        <li><b>כ־15</b><span>חוקרי בינה מלאכותית בעלי מוניטין בין־לאומי במחלקה</span></li>
        <li><b>2 מתוך 6</b><span>עמיתי AAAI בישראל</span></li>
        <li><b>3 מתוך 8</b><span>עמיתי EurAI בישראל</span></li>
        <li><b>מקום 1 בישראל</b><span>עיבוד שפה טבעית (1986–2026) ואבטחת מחשבים, לפי CSRankings</span></li>
      </ul>
    </section>
    <section><h2 id="tracks">מסלולים</h2>
      <ul class="kv">
        <li><b>חד־חוגי</b><span>בינה מלאכותית חישובית בלבד, עם תחילת לימודים בסמסטר א׳ (מסלול 89-105). למי שרוצה להתמקד בצדדים המדעיים והחישוביים של מדעי הנתונים והבינה המלאכותית, ולא במדעי המחשב באופן כללי.</span></li>
        <li><b>דו־חוגי</b><span>בינה מלאכותית חישובית בשילוב מחלקה נוספת, כמו מתמטיקה או פיזיקה.</span></li>
        <li><b>מסלול ישיר (מעלות)</b><span>מסלול מצטיינים המשלב תואר ראשון ושני בתוך 4 שנים. נדרשים ממוצע 90 ומעלה ואישור ראש המחלקה.</span></li>
      </ul>
    </section>
    <section><h2 id="admission">למי זה מתאים</h2>
      <p>תוכנית הלימודים מעמיקה ותובענית. היא מתאימה לסטודנטים מצטיינים בעלי יכולת כמותית גבוהה, סקרנות ומחויבות למצוינות, שמכוונים לקריירה כמהנדסי למידת מכונה, חוקרי בינה מלאכותית או מפתחי בינה מלאכותית.</p>
      <ul class="checks"><li>ציון 700 ומעלה במבחן הפסיכומטרי</li><li>ציון 130 ומעלה בחשיבה כמותית</li><li>מכפלה של 370 ומעלה במתמטיקה (יחידות × ציון בגרות)</li><li>סכם קבלה 74 ומעלה</li></ul>
      <p class="note"><b>מלגת SMART:</b> סטודנטים שהתקבלו לתוכנית SMART עם פסיכומטרי 700 ומעלה מקבלים מלגת שכר לימוד בגובה 50%, אייפד של Apple ומנוי AI מתקדם. הקבלה ל־SMART מותנית גם בראיון.</p>

      <p class="muted">קורסי ההשלמה לבוגרי מתמטיקה, פיזיקה והנדסה נלקחים מרשימת הקורסים של התואר הראשון.</p>

      <p>יש להשיג את הסכמתו של חבר סגל בכיר עד סוף סמסטר א׳, ולא יאוחר מסוף סמסטר ב׳ של השנה הראשונה. פנו למנחים פוטנציאליים מוקדם, ובחרו את קורסי הבחירה שהם ממליצים עליהם.</p>

  <div class="page-head"><div><span class="pbadge lg"><svg class="ico" aria-hidden="true"><use href="#i-cap"/></svg></span><span class="label">תארים מתקדמים</span><h1>Ph.D. במדעי המחשב</h1><p>עבדו לצד חוקרים מובילים במעבדות מתקדמות ופרסמו בבמות המובילות, במחלקה דינמית ומזמינה.</p></div></div>

  <div class="doc"><aside class="toc"></aside><div class="doc-body">
    <section><h2 id="tracks">מסלולים וקבלה</h2>
      <p>כל מסלול מחייב מנחה מאושר מהסגל הבכיר של המחלקה. הוועדה שוקלת גם את הממוצע, את דירוג המוסד, את הדירוג במחזור, את הניסיון המחקרי ואת מכתבי ההמלצה.</p>
      <div class="table-wrap"><table class="data">
        <thead><tr><th>מסלול</th><th>למי</th><th>דרישות מינימום</th><th>משך</th></tr></thead>

          <tr><td><b>בין־לאומי</b></td><td>בעלי תארים ממוסדות מחוץ לישראל</td><td>M.Sc. עם תזה. מדעי המחשב 86 ומעלה, תחום קרוב 90 ומעלה, תזה 90 ומעלה. וגם מאמר מלא שפורסם בבמה בדירוג A,‏ A*,‏ A+ או Q1</td><td>4–5 שנים</td></tr>
          <tr><td><b>רגיל</b></td><td>בעלי תארים ממוסדות בישראל</td><td>M.Sc. עם תזה. מדעי המחשב 86 ומעלה, תחום קרוב 90 ומעלה, תזה 90 ומעלה</td><td>4–5 שנים</td></tr>
          <tr><td><b>ישיר</b></td><td>בוגרי B.Sc. ממוסדות בישראל</td><td>B.Sc. במדעי המחשב 90 ומעלה, תחום קרוב 93 ומעלה</td><td>5–6 שנים</td></tr>
          <tr><td><b>משולב M.Sc.–Ph.D.</b></td><td>סטודנטים יוצאי דופן שכבר לומדים אצלנו לתואר שני</td><td>לפי תקנון האוניברסיטה</td><td>2 + 3–4 שנים</td></tr>
        </tbody>
      </table></div>
      <p class="muted">תחומים קרובים כוללים מתמטיקה, ביולוגיה חישובית, פיזיקה והנדסה. מועמדים בין־לאומיים חייבים להופיע כמחברים של מאמר מלא שפורסם בכנס או בכתב עת בדירוג A,‏ A*,‏ A+ או Q1 במדעי המחשב או בתחום קרוב. את דירוג הבמות אפשר לבדוק ב־<a class="inline" href="https://portal.core.edu.au/conf-ranks/" target="_blank" rel="noopener">CORE</a>,‏ <a class="inline" href="https://abdc.edu.au/abdc-journal-quality-list/" target="_blank" rel="noopener">ABDC</a> או <a class="inline" href="https://www.scimagojr.com/index.php" target="_blank" rel="noopener">Scimago</a>.</p>
    </section>
    <section><h2 id="apply">מה לשלוח</h2>
      <ul class="checks">
        <li>גיליונות ציונים ותעודות רשמיים לתואר הראשון ולתואר השני</li>
        <li>דירוג רשמי במחזור ובתוכנית</li>
        <li>קישור לפרטי התוכנית ולסילבוסים במוסד שלכם</li>
        <li>קורות חיים הכוללים השכלה, תעסוקה, פרסים והישגים</li>
        <li>קישור לרשימת פרסומים רשמית (למועמדים בין־לאומיים), עם אישורי קבלה</li>
        <li>מכתבי המלצה (רשות)</li>
      </ul>
    </section>
    <section><h2 id="funding">מימון ותמיכה</h2>
      <ul class="checks">
        <li>מלגות לסטודנטים במשרה מלאה, ופרסים לסטודנטים מצטיינים</li>
        <li>מימון לציוד מחקר, לנסיעות לכנסים ולפעילות אקדמית</li>
        <li>סיוע באשרות, בדיור ובהשתלבות חברתית לסטודנטים בין־לאומיים</li>
      </ul>
    </section>
    <section><h2 id="milestones">אבני דרך</h2>
      <ol class="steps">
        <li><b>שנה א׳: הצעת מחקר.</b> יש לקבל אישור לתוכנית לימודים מפורטת מראש המחלקה ומהוועדה האוניברסיטאית לתלמידי מחקר. לאחר מכן מגישים ומציגים את ההצעה (30–40 דקות, כשעה כולל דיון), הכוללת סקירת ספרות, הגדרת הבעיה, תוצאות ראשוניות ותוכנית עבודה.</li>
        <li><b>בכל שנה: דו״ח התקדמות</b> באישור המנחה, למחלקה ולוועדה האוניברסיטאית לתלמידי מחקר.</li>
        <li><b>שנה ג׳, עד 10 באוגוסט: דו״ח ¾.</b> סיכום בן עמוד אחד של המחקר ביחס להצעה, עם רשימת הפרסומים. הדו״ח נדרש מכולם, ויש לקבל את אישורו לפני ההרשמה לשנה הרביעית.</li>
        <li><b>הגשה.</b> שלושה עותקים מודפסים, קבצים דיגיטליים וטפסים מוגשים לבית הספר ללימודים מתקדמים בבניין 403.</li>
      </ol>
    </section>
    <section><h2 id="requirements">חובות קורסים</h2>
      <ul class="kv">
        <li><b>מסלול רגיל</b><span>2 נקודות זכות (שעה שבועית) של קורסים במדעי המחשב בכל סמסטר, 16 נקודות בסך הכול (8 שעות שבועיות). הבחירה נעשית עם המנחה.</span></li>
        <li><b>ישיר / משולב</b><span>קודם משלימים את כל חובות הקורסים של התואר השני, ובשנתיים הראשונות יש פטור מקורסי דוקטורט. אחרי הקבלה לדוקטורט לומדים 2 נקודות זכות (שעה שבועית) בכל סמסטר, 12 נקודות בסך הכול (6 שעות שבועיות).</span></li>
        <li><b>פטור בזכות הוראה</b><span>מי שמלמד קורס כמתרגל או כמרצה יכול לקבל פטור מחובת הקורסים באותו סמסטר. יש לבקש את הפטור בכל סמסטר.</span></li>
        <li><b>קולוקוויום</b><span>חובה להשתתף בקולוקוויום המחלקתי.</span></li>
        <li><b>אנגלית</b><span>סטודנטים המבקשים פטור חייבים להירשם לכתיבה אקדמית (41-044). המחלקה אינה מעניקה פטורים.</span></li>
