name: checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # Mondays, to catch link rot
  workflow_dispatch:

jobs:
  links:
    name: External links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-links.mjs

  hebrew-in-sync:
    name: Hebrew page is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build-he.mjs
      - name: he/index.html must match a fresh build
        run: git diff --exit-code he/index.html
